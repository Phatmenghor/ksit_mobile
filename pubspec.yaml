name: ksit_mobile
description: A new Flutter project with GetX, Go Router, and Firebase.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Routing
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2

  # UI Components
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.4
  infinite_scroll_pagination: ^4.0.0
  image_picker: ^1.0.4

  # Utils
  logger: ^2.0.2+1
  intl: ^0.18.1

  # Icons
  cupertino_icons: ^1.0.2
  modal_bottom_sheet: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
